# Verder denken: essays van Duncan Panis op duncanpanis.be die over AI gaan.
# Ze geven de filosofische achtergrond bij AI Ontcijferd. Nieuwste bovenaan.
# Velden: titel, url, datum, samenvatting (één zin, neutraal). Duncan beslist welke essays hier staan.
- titel: "Wat is mijn doel?"
  url: https://duncanpanis.be/geschriften/wat-is-mijn-doel/
  datum: 2026-11-15
  samenvatting: "Of je iets zelf doet of door AI laat doen, hangt af van je doel en van het deel van het werk dat je maakt tot wie je bent."
- titel: "Het probleem is niet de machine"
  url: https://duncanpanis.be/geschriften/probleem-is-niet-de-machine/
  datum: 2026-11-14
  samenvatting: "Tussen doemdenken en utopie: het probleem ligt niet bij AI, maar bij de mensen en de cultuur eromheen."
- titel: "Ook de machine is natuur"
  url: https://duncanpanis.be/geschriften/ook-de-machine-is-natuur/
  datum: 2026-11-08
  samenvatting: "Wat mensen maken is tegelijk kunstmatig en natuurlijk, en wat dat betekent voor AI en voor de mens als niet langer het hoogste."
- titel: "Arethocratie"
  url: https://duncanpanis.be/geschriften/arethocratie/
  datum: 2026-10-23
  samenvatting: "Als AI en automatisering menselijke arbeid overbodig maken, wat wordt dan het fundament van een samenleving?"
- titel: "De digitale renaissance"
  url: https://duncanpanis.be/geschriften/digitale-renaissance/
  datum: 2026-10-23
  samenvatting: "AI kan leiden tot een nieuwe bloei of een nieuwe donkere tijd, en dat hangt af van de mensen die het gebruiken."
