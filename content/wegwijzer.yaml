  # --- Bibliotheken ---
  - naam: "LIBRA.I.: handboek AI in openbare bibliotheken"
    aanbieder: Goethe-Institut Brussel met Muntpunt, FARI (ULB), de stadsbibliotheek van Łódź en de Letse Nationale Bibliotheek
    url: https://www.goethe.de/resources/files/pdf359/handboek_librai_nl.pdf
    soort: lesmateriaal
    wat: >-
      Methodiek om AI in te zetten voor media- en informatiegeletterdheid in de bibliotheek: tien thematische blokken
      (van basiskennis tot verandermanagement) en vier lesplannen, met voorbeelden voor jongeren, senioren en makers.
      Nederlandse versie; project liep van november 2024 tot oktober 2026.
    doelgroepen: [Bibliotheken]
    ingang: lesgeven
    niveau: "N0–N3"
    prijs: gratis
    licentie: "CC BY-SA 4.0"
    taal: nl en en
    verwijs_als: "een bibliotheek een methodiek voor het team zoekt; wij leveren kant-en-klare publiekssessies"
    verhouding: aanvulling
    laatstGecontroleerd: 2026-11-24
    status: gecontroleerd
    bron: "het handboek zelf (licentie en partners op de colofonpagina). Let op: een bewerking moet onder CC BY-SA blijven, dus niet mengen met onze CC BY-pakketten zonder dat te melden."

  - naam: "DigLib (Digital Libraries)"
    aanbieder: FRSI, Public Libraries 2030, EOS, CSBNO en Dot Beyond (Erasmus+)
    url: https://dig-lib.eu
    soort: onderzoek
    wat: >-
      Europees project (2025–2027) dat bibliothecarissen opleidt om digitale vaardigheden bij volwassenen te begeleiden.
      Er is een open onderzoeksrapport (augustus 2025, met een bevraging bij bibliotheekmedewerkers in Italië, Polen,
      Roemenië en Vlaanderen); een opleidingsprogramma en leerplatform volgen. Proefbibliotheken in vier landen.
    doelgroepen: [Bibliotheken]
    ingang: lesgeven
    niveau: "N1–N3"
    prijs: gratis
    licentie: "rapport open access; licentie van het platform niet vermeld"
    taal: en
    verwijs_als: "een bibliotheek wil weten hoe Europese collega's volwassenen digitaal begeleiden"
    verhouding: aanvulling
    laatstGecontroleerd: 2026-11-24
    status: gecontroleerd
    bron: "dig-lib.eu; dig-lib.eu/contacts; EU Digital Skills and Jobs Platform"
