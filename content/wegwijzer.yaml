# Wegwijzer: wat anderen in Vlaanderen (en net daarbuiten) al goed aanbieden over AI.
#
# Waarom: de visie zegt "zelf maken wat ontbreekt, verwijzen naar wat goed is". Deze lijst voedt de pagina /wegwijzer
# en het blok "Elders goed" op de doelgroeppagina's (/voor/<doelgroep>). Eerste versie 24/11/2026, pagina 25/11/2026.
#
# Velden
#   slug          kort, uniek; wordt het anker op de pagina (/wegwijzer#<slug>)
#   naam, aanbieder, url
#   soort:        lesmateriaal | opleiding | richtlijn | kader | tool | overzicht | netwerk | onderzoek | evenement | hulp
#   wat:          wat je er vindt, in een of twee zinnen
#   doelgroepen:  Onderwijs, Werk, Lokale overheden, Zelfstandigen, Bibliotheken, Burgers (zoals in toepassingen.yaml)
#   ingang:       volgen | leren | doen | lesgeven (de vier ingangen uit de visie)
#   niveau:       N0 tot N4 (schatting van de redactie, zoals bij de pakketten)
#   prijs:        gratis | betalend | gemengd | onbekend; prijs_tekst (optioneel) zegt het precies
#   licentie:     zoals de bron het zegt; "niet vermeld" als de bron niets zegt (dan alleen verwijzen, niet overnemen)
#   taal:         nl | en | nl en en
#   verwijs_als:  wanneer je erheen gaat, in de jij-vorm ("je ..."); de pagina zet er "Ga hierheen als" voor
#   bij_ons:      optioneel: wat wij ernaast hebben {tekst, href}
#   verhouding:   aanvulling (wij hebben het niet) | overlap (wij hebben iets gelijkaardigs) | bron (wij bouwen erop)
#   laatstGecontroleerd, status (gecontroleerd | TE CONTROLEREN), bron
#
# Regels
# - Alleen wat we zelf bij de aanbieder of in een officiële bron zagen krijgt "gecontroleerd". De pagina toont
#   alleen gecontroleerde items; TE CONTROLEREN blijft hier tot het is nagekeken.
# - Wie erin komt: Vlaams of Nederlandstalig (anders zeggen we het), voor een van onze doelgroepen, actueel,
#   prijs en licentie eerlijk vermeld. Geen verkopers van AI-tools en geen reclame; wij krijgen er niets voor.
# - Een organisatie met een eigen standpunt (vakbond, werkgeversorganisatie) mag erin, maar het staat erbij.
# - Geen namen van individuele medewerkers. Elk kwartaal nakijken (zelfde ritme als de terugblik).

