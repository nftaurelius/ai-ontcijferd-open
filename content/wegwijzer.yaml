# Wegwijzer: wat anderen in Vlaanderen (en net daarbuiten) al goed aanbieden over AI.
#
# Waarom: de visie zegt "zelf maken wat ontbreekt, verwijzen naar wat goed is". Dit bestand is de lijst waar we
# naar verwijzen. Nog geen pagina op de site: Duncan kiest eerst wat erop komt (eerste versie 24/11/2026).
#
# Velden
#   naam, aanbieder, url
#   soort:        lesmateriaal | opleiding | richtlijn | kader | tool | overzicht | netwerk | onderzoek
#   wat:          wat je er vindt, in een of twee zinnen
#   doelgroepen:  Onderwijs, Werk, Lokale overheden, Zelfstandigen, Bibliotheken, Burgers (zoals in toepassingen.yaml)
#   ingang:       volgen | leren | doen | lesgeven (de vier ingangen uit de visie)
#   niveau:       N0 tot N4 (schatting van de redactie, zoals bij de pakketten)
#   prijs:        gratis | betalend | gemengd | onbekend
#   licentie:     zoals de bron het zegt; "niet vermeld" als de bron niets zegt (dan alleen verwijzen, niet overnemen)
#   taal:         nl | en | nl en en
#   verwijs_als:  wanneer we iemand hierheen sturen (wat zij hebben en wij niet)
#   verhouding:   aanvulling (wij hebben het niet) | overlap (wij hebben iets gelijkaardigs) | bron (wij bouwen erop)
#   laatstGecontroleerd, status (gecontroleerd | TE CONTROLEREN), bron
#
# Regels: alleen wat we zelf op de site van de aanbieder of in een officiële bron zagen krijgt "gecontroleerd".
# Geen namen van individuele medewerkers. Een aanbod dat verdwijnt of verouderd is, krijgt status TE CONTROLEREN
# tot het is nagekeken; de bronnencheck kan deze lijst later meenemen.

