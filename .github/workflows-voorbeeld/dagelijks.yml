name: Dagelijks — verkenner en triage

on:
  schedule:
    - cron: "17 5 * * *"   # elke dag rond 6u17/7u17 Belgische tijd
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pijplijn
  cancel-in-progress: false

jobs:
  dagelijks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Verkenner
        run: python -m pipeline.verkenner

      - name: X-radar (Grok; wordt overgeslagen zonder XAI_API_KEY)
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python -m pipeline.xradar

      - name: Triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.triage

      - name: Gegevens bewaren (ook bij fouten)
        if: always()
        run: |
          git config user.name "ai-ontcijferd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Verkenner en triage $(date +%F)"
          git pull --rebase --autostash origin main
          git push
