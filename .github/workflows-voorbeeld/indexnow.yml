name: IndexNow — nieuwe pagina's melden aan Bing

# Na elke wijziging aan de site (en dagelijks) de nieuwe adressen uit de sitemap melden via IndexNow.
# Geen secret nodig: de sleutel staat publiek in site/public/<sleutel>.txt, zoals IndexNow vraagt.

on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "pipeline/indexnow.py", ".github/workflows/indexnow.yml"]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  melden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Melden
        run: python -m pipeline.indexnow ${{ github.event_name == 'push' && '--wacht' || '' }}
      - name: Bewaren
        run: |
          git config user.name "ai-ontcijferd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/indexnow-gemeld.txt
          git diff --cached --quiet && exit 0
          git commit -m "IndexNow $(date +%F)"
          git pull --rebase --autostash origin main
          git push
