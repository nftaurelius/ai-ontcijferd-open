name: Bronnencheck

on:
  schedule:
    - cron: "53 4 * * 1"   # maandagochtend
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Alle bronnen testen
        run: python -m pipeline.bronnencheck --alle
      - name: Overzicht bewaren
        run: |
          git config user.name "ai-ontcijferd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bronnencheck.md
          git diff --cached --quiet || git commit -m "Bronnencheck $(date +%F)"
          git pull --rebase --autostash origin main
          git push
