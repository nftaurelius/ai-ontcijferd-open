name: Probe — adressen testen

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adressen om te testen, gescheiden door spaties"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Adressen testen
        env:
          URLS: ${{ inputs.urls }}
        run: python -m pipeline.probe $URLS
      - name: Resultaat bewaren
        run: |
          git config user.name "ai-ontcijferd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/probe.md
          git diff --cached --quiet || git commit -m "Probe $(date +%F)"
          git pull --rebase --autostash origin main
          git push
