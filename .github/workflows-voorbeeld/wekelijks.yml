name: Wekelijks — concept Stand van AI

on:
  schedule:
    - cron: "41 5 * * 5"   # vrijdagochtend: concept klaar om na te lezen
  workflow_dispatch:
    inputs:
      datum:
        description: "Optioneel: vrijdag waarvoor de editie gemaakt wordt (JJJJ-MM-DD). Leeg = vandaag."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pijplijn
  cancel-in-progress: false

jobs:
  weekeditie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Week bepalen
        id: week
        env:
          AIO_DATUM: ${{ inputs.datum }}
        run: echo "sleutel=$(python -c 'import datetime as d, os; v=os.environ.get("AIO_DATUM") or ""; x=d.date.fromisoformat(v) if v else d.date.today(); j,w,_=x.isocalendar(); print(f"{j}-w{w:02d}")')" >> "$GITHUB_OUTPUT"

      - name: Concept maken (analist, vertaler, tegenspreker, revisie)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIO_KOSTEN_PAD: data/weken/${{ steps.week.outputs.sleutel }}/kosten.csv
          AIO_DATUM: ${{ inputs.datum }}
        run: python -m pipeline.weekeditie

      - name: Pull request voor de eindredactie
        uses: peter-evans/create-pull-request@v7
        with:
          branch: editie/${{ steps.week.outputs.sleutel }}
          title: "Stand van AI ${{ steps.week.outputs.sleutel }} (concept)"
          body-path: data/weken/${{ steps.week.outputs.sleutel }}/pr.md
          commit-message: "Concept Stand van AI ${{ steps.week.outputs.sleutel }}"
          add-paths: |
            content
            data/weken
          labels: eindredactie

      - name: Foutrapport bewaren
        if: failure()
        run: |
          git config user.name "ai-ontcijferd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fouten || true
          git diff --cached --quiet || git commit -m "Foutrapport weekeditie $(date +%F)"
          git pull --rebase --autostash origin main
          git push
